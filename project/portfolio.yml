# Portfolio manifest for nolte/cookiecutter-gh-project.
# Schema: spec/portfolio/portfolio-management/ §Capability inventory per repository
# Audience references resolve against AUDIENCES.md at the repo root.

capabilities:
  - name: github-project-cookiecutter-template
    description: >-
      A Cookiecutter template that scaffolds a standardised nolte-style GitHub
      project — pre-wired GitHub Actions and settings based on nolte/gh-plumbing
      (release process, MkDocs docs publishing, static tests, labelling) — from
      a single cookiecutter run.
    audience:
      - "Developer scaffolding a new nolte-style GitHub project"
    status: active
    rationale: >-
      This repository owns the project-scaffolding template in the portfolio;
      consolidating the standard layout here means new repositories start from
      one consistent, gh-plumbing-aligned baseline.
    peers:
      - gh-plumbing:reusable-github-actions-workflows
      - gh-plumbing:probot-commons-config

# tech_stack: repo-specific deltas vs the inherited portfolio baseline
# (portfolio/tech-stack.yml). Schema: spec/portfolio/tech-stack/ §Per-repository block.
tech_stack:
  additions:
    - name: python
      kind: language
      group: build-tooling
      version: "3.14.0"
      role: Implementation language for the Cookiecutter pre/post-generation hooks and the pytest-cookies harness.
      status: active
      lifecycle: build
      source_of_truth: .tool-versions
      rationale: >-
        python here drives the template-generation hooks and tests rather than an application
        runtime, so it is grouped under build-tooling.
    - name: cookiecutter
      kind: framework
      group: build-tooling
      role: Project-template engine defining the repository's shape; renders a new project from cookiecutter.json plus hooks.
      status: active
      lifecycle: build
      source_of_truth: cookiecutter.json
