name: "🚀 Feature Request"
description: "Suggest an improvement or new capability"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature. Sketching the use case alongside the proposal helps the maintainers evaluate the request and decide on priority.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature do you want to see and why is it useful?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What real-world scenario does this enable? Who benefits?
    validations:
      required: true

  - type: textarea
    id: proposed-usage
    attributes:
      label: Proposed usage (optional)
      description: If you have a sketch of how this would be configured or invoked, paste it here.

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related issues, pull requests, blog posts, or upstream documentation.
